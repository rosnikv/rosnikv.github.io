<style>
    .table-responsive .lec-years {
        white-space: nowrap; /* Ensure the date doesn't wrap */
        width: 100px; /* Adjust width as necessary */
        padding-right: 15px; /* Add some space between the date and content */
        vertical-align: middle; /* Center align vertically if necessary */
    }

    :root {
    /* Default Light Mode Colors */
    --background-color: #f9f9f9;
    --text-color: #333;
    --border-color: #ddd;
    --hover-color: #f1f1f1;
}

[data-theme="dark"] {
    /* Dark Mode Colors */
    --background-color: #2c2c2c;
    --text-color: #eaeaea;
    --border-color: #444;
    --hover-color: #444;
}

.table-responsive {
    border: 1px solid var(--border-color); /* Use dynamic border color */
    border-radius: 5px;
    padding: 10px;
    background-color: var(--background-color); /* Use dynamic background */
}

.table td {
    padding: 10px 15px;
    vertical-align: top;
    font-size: 1em;
    color: var(--text-color); /* Dynamic text color */
}

.lec-years {
    white-space: nowrap;
    width: 120px;
    font-weight: bold;
    color: var(--text-color); /* Dynamic text color */
    text-align: left;
}

.table td:last-child {
    color: var(--text-color); /* Ensure content color adapts */
}

.table tr:hover {
    background-color: var(--hover-color); /* Dynamic hover effect */
}

.news-content.collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.news-read-more {
    font-size: 0.75rem;
    color: var(--global-theme-color);
    text-decoration: none;
    display: inline-block;
    margin-top: 2px;
}

    </style>
    <script>
    function toggleNews(link) {
        var content = link.previousElementSibling;
        if (content.classList.contains('collapsed')) {
            content.classList.remove('collapsed');
            link.textContent = 'show less';
        } else {
            content.classList.add('collapsed');
            link.textContent = 'read more';
        }
    }
    </script>
    

    <div class="news">
        {% if site.news %}
        <div class="table-responsive">
            <table class="table table-sm table-borderless">
                {% assign newss = site.news | reverse %}
                {% for item in newss limit: site.news_limit %}
                <tr>
                    <td scope="row" class="lec-years">{{ item.date | date: "%b %d, %Y" }}</td>
                    <td>
                        <div class="news-content collapsed">{{ item.content | remove: '<p>' | remove: '</p>' | emojify }}</div>
                        <a href="#" class="news-read-more" onclick="toggleNews(this);return false;">read more</a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
        {% else %}
        <p>No news so far...</p>
        {% endif %}
    </div>
